<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form align="center">
        <h2>Hotel Room Booking Form</h2><br>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address"><br><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"><br><br>
        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" name="checkin"><br><br>
        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" name="checkout"><br><br>
        <label for="room">Room Type:</label>
        <select id="room" name="room">
            <option value="single">Single Room</option>
            <option value="double">Double Room</option>
        </select><br><br>

        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" placeholder="e.g, 2"><br><br>

        <label for="requests">Special Requests:</label><br>
        <textarea id="requests" name="requests" rows="4" cols="40" placeholder="Enter any special requests here..."></textarea><br><br>
    special requests here..."></textarea><br><br>
        <input type="submit" value="Book Now">
        <input type="reset" value="Reset Form"><br><br>
    </form>

</body>
</html>
