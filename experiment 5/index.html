<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Experiment 5 - HTML Forms</title>    
    </head>
    <body>
        <form align="center">
            <h2>Student Registration Form</h2>
            <br><hr>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address"><br><br> 
            <label for="password">password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password">
            <br><br>
            <label for="course">course:</label>
            <select id="course" name="course" placeholder="Select your course"> 
                <option value="btech">B.Tech</option>
                <option value="mtech">M.Tech</option>
                <option value="mba">MBA</option>
                <option value="msc">M.Sc</option>
            </select>
            <br><br>
            <label for="Contact">Contact :</label>
            <input type="tel" id="contact" name="contact" placeholder="Enter your contact number">
            <br><br>
            <label for="address">Address:</label>
            <textarea id="address" name="address" placeholder="Enter your address"></textarea>
            <br><br>
            <input type="submit" value="Register">
            <input type="reset" Clear">
            <br>
            <hr>
            <p> &copy; 2025 Student Registration Portal</p>
        </form>
 </body>
</html>
